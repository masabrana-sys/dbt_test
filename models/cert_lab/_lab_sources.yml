sources:
  - name: lab
    # The lab seeds load into your own target schema, so the source points there
    schema: "{{ target.schema }}"
    tables:
      - name: lab_raw_orders
        config:
          event_time: ordered_at
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: lab_raw_customers
